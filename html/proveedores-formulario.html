<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Administrativo - Formulario Proveedor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <a href="index.html" aria-label="Ir al inicio del dashboard">
            <span class="sidebar__logo" aria-hidden="true">
              <img src="logo.png" alt="" class="brand-logo-img" />
            </span>
            <div>
              <h1>CR-Tech</h1>
              <p>Panel Admin</p>
            </div>
          </a>
        </div>

        <nav class="sidebar__nav" aria-label="Navegación principal">
          <a class="sidebar__link" href="index.html">
            <span aria-hidden="true">📊</span>
            <span>Inicio</span>
          </a>
          <a class="sidebar__link" href="productos.html">
            <span aria-hidden="true">📦</span>
            <span>Productos</span>
          </a>
          <a class="sidebar__link" href="proveedores.html">
            <span aria-hidden="true">🧾</span>
            <span>Proveedores</span>
          </a>
          <a class="sidebar__link sidebar__link--active" href="proveedores-formulario.html">
            <span aria-hidden="true">📝</span>
            <span>Formulario</span>
          </a>
          <a class="sidebar__link" href="resumen.html">
            <span aria-hidden="true">📈</span>
            <span>Resumen</span>
          </a>
          <a class="sidebar__link" href="login.html">
            <span aria-hidden="true">🔐</span>
            <span>Cerrar sesión</span>
          </a>
        </nav>
      </aside>

      <div class="main-content">
        <header class="topbar">
          <button class="topbar__menu-btn" id="menu-toggle" type="button" aria-label="Abrir menú lateral">☰</button>
          <div class="topbar__user">
            <span aria-hidden="true">👤</span>
            <span>Samu · Integrante 2</span>
          </div>
        </header>

        <main class="content">
          <section class="page-header" aria-labelledby="page-title">
            <div>
              <p class="eyebrow">Registro de proveedore</p>
              <h2 id="page-title">Formulario de proveedor</h2>
            </div>
          </section>

          <section class="card" aria-labelledby="form-title">
            <div class="card__header">
              <div>
                <h3 id="form-title">Crear o editar proveedor</h3>
                <p class="card__description">Completa los datos y guárdalos desde este apartado independiente.</p>
              </div>
            </div>
            <div class="card__body">
              <form class="form-grid" novalidate>
                <div class="form-group form-group--full">
                  <label class="label" for="proveedor-id">ID</label>
                  <input class="input" type="text" id="proveedor-id" placeholder="Ej. 1" readonly />
                </div>
                <div class="form-group">
                  <label class="label" for="proveedor-nombre">Nombre / Empresa</label>
                  <input class="input" type="text" id="proveedor-nombre" required maxlength="50" />
                </div>
                <div class="form-group">
                  <label class="label" for="proveedor-contacto">Contacto</label>
                  <input class="input" type="text" id="proveedor-contacto" required maxlength="50" />
                </div>
                <div class="form-group">
                  <label class="label" for="proveedor-telefono">Teléfono</label>
                  <input class="input" type="tel" id="proveedor-telefono" required maxlength="15" />
                </div>
                <div class="form-group">
                  <label class="label" for="proveedor-categoria">Categoría</label>
                  <select class="select" id="proveedor-categoria" required>
                    <option value="">Seleccione una categoría</option>
                    <option value="Electrónica">Electrónica</option>
                    <option value="Papelería">Papelería</option>
                    <option value="Muebles">Muebles</option>
                    <option value="Servicios">Servicios</option>
                  </select>
                </div>
                <div class="form-group form-group--full form-actions">
                  <button class="btn btn--primary" type="submit">Guardar proveedor</button>
                  <button class="btn btn--ghost" type="reset">Limpiar</button>
                </div>
              </form>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../js/i18n.js"></script>
    <script type="module" src="../js/proveedores-formulario.js"></script>
  </body>
</html>
